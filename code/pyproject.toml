[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vasclinknet-preview"
version = "0.1.0"
description = "Research preview interfaces for VascLinkNet"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "VascLinkNet Authors" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
vasclinknet-preview = "vasclinknet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
